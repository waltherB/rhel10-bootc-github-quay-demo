---
- name: Provision VM boot image from Quay on OpenShift Virtualization
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    vm_namespace: bootc-vms
    vm_name: rhel10-bootc
    quay_image: "quay.io/waba/bootc-guide:prod"   # any quay.io/<org>/<image>:<tag> container disk
    storage_class: "lvms-vg1"   # set to your cluster's SC
    disk_size: "30Gi"
    vm_cpu_cores: 2
    vm_memory: "4Gi"
    run_strategy: "Always"   # Always | Manual | RerunOnFailure | Halted

    # Quay registry credentials for private image pull.
    # Never hardcode quay_password here — pass via env var, ansible-vault, or -e on the CLI.
    quay_registry: "quay.io"
    quay_username: "wab+bootc_guide_robot"          # e.g. Quay robot account name
    quay_password: "{{ lookup('env', 'QUAY_ROBOT_TOKEN') }}"

  tasks:

    - name: Ensure namespace exists
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ vm_namespace }}"

    - name: Fail fast if Quay credentials are missing
      ansible.builtin.fail:
        msg: "quay_password is empty. Set QUAY_ROBOT_TOKEN env var or pass -e quay_password=... on the CLI."
      when: quay_password | length == 0

    - name: Create pull secret for private Quay image
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          type: kubernetes.io/dockerconfigjson
          metadata:
            name: "{{ vm_name }}-quay-pull-secret"
            namespace: "{{ vm_namespace }}"
          data:
            .dockerconfigjson: "{{ ({
                'auths': {
                  quay_registry: {
                    'username': quay_username,
                    'password': quay_password,
                    'auth': (quay_username + ':' + quay_password) | b64encode
                  }
                }
              } | to_json) | b64encode }}"

    # --- Detect volumeBindingMode so we know what "ready to proceed" means ---
    - name: Look up StorageClass to check volumeBindingMode
      kubernetes.core.k8s_info:
        api_version: storage.k8s.io/v1
        kind: StorageClass
        name: "{{ storage_class }}"
      register: sc_info
      ignore_errors: true

    - name: Fail fast if StorageClass lookup errored (RBAC/name typo)
      ansible.builtin.fail:
        msg: "Could not look up StorageClass {{ storage_class }}: {{ sc_info.msg | default('unknown error') }}"
      when: sc_info is failed or (sc_info.resources | default([]) | length == 0)

    - name: Set fact for binding mode
      ansible.builtin.set_fact:
        sc_binding_mode: "{{ sc_info.resources[0].volumeBindingMode | default('Immediate') }}"

    - name: Show detected binding mode
      ansible.builtin.debug:
        msg: "StorageClass {{ storage_class }} uses volumeBindingMode={{ sc_binding_mode }}"

    # --- Create the DataVolume, authenticated against Quay via secretRef ---
    - name: Create DataVolume importing boot image from Quay
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: cdi.kubevirt.io/v1beta1
          kind: DataVolume
          metadata:
            name: "{{ vm_name }}-boot-dv"
            namespace: "{{ vm_namespace }}"
          spec:
            source:
              registry:
                url: "docker://{{ quay_image }}"
                secretRef: "{{ vm_name }}-quay-pull-secret"
            storage:
              resources:
                requests:
                  storage: "{{ disk_size }}"
              storageClassName: "{{ storage_class }}"
              accessModes:
                - ReadWriteOnce

    - name: Sanity-check DataVolume lookup before waiting
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ vm_name }}-boot-dv"
        namespace: "{{ vm_namespace }}"
      register: dv_debug
      ignore_errors: true

    - name: Fail fast if the k8s_info call itself is erroring
      ansible.builtin.fail:
        msg: "kubernetes.core.k8s_info failed outright: {{ dv_debug.msg | default('none') }}"
      when: dv_debug is failed

    # --- Wait for a "proceed" state: Succeeded immediately (Immediate binding),
    #     or WaitForFirstConsumer / PendingPopulation (WFFC + populator flow,
    #     both mean "waiting for a consumer to bind the PVC", not an error). ---
    - name: Wait for DataVolume to reach a state where we can proceed
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ vm_name }}-boot-dv"
        namespace: "{{ vm_namespace }}"
      register: dv
      until: >
        (dv.resources | default([]) | length > 0) and
        (dv.resources[0].status.phase | default('') in
          (['Succeeded', 'WaitForFirstConsumer', 'PendingPopulation'] if sc_binding_mode == 'WaitForFirstConsumer' else ['Succeeded']))
      retries: 40
      delay: 10
      ignore_errors: true

    - name: Fail with diagnostics if DataVolume never reached a usable state
      ansible.builtin.fail:
        msg: >
          DataVolume {{ vm_name }}-boot-dv stuck.
          Last known status: {{ dv.resources[0].status | default('no status - see dv.msg') }}
          Raw error (if any): {{ dv.msg | default('none') }}
      when: >
        (dv.resources | default([]) | length == 0) or
        (dv.resources[0].status.phase | default('') not in
          (['Succeeded', 'WaitForFirstConsumer', 'PendingPopulation'] if sc_binding_mode == 'WaitForFirstConsumer' else ['Succeeded']))

    # --- Create the VM. Always internally during provisioning so a virt-launcher
    #     pod gets scheduled, becomes the PVC's first consumer, and unblocks
    #     the populator/import; reconciled to the desired run_strategy after. ---
    - name: Create VirtualMachine using the DataVolume
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ vm_name }}"
            namespace: "{{ vm_namespace }}"
            labels:
              app: "{{ vm_name }}"
          spec:
            runStrategy: "Always"
            dataVolumeTemplates: []
            template:
              metadata:
                labels:
                  kubevirt.io/domain: "{{ vm_name }}"
              spec:
                domain:
                  cpu:
                    cores: "{{ vm_cpu_cores }}"
                  memory:
                    guest: "{{ vm_memory }}"
                  devices:
                    disks:
                      - name: bootdisk
                        disk:
                          bus: virtio
                      - name: cloudinitdisk
                        disk:
                          bus: virtio
                    interfaces:
                      - name: default
                        masquerade: {}
                    networkInterfaceMultiqueue: true
                networks:
                  - name: default
                    pod: {}
                volumes:
                  - name: bootdisk
                    dataVolume:
                      name: "{{ vm_name }}-boot-dv"
                  - name: cloudinitdisk
                    cloudInitNoCloud:
                      userData: |
                        #cloud-config
                        user: cloud-user
                        password: changeme
                        chpasswd:
                          expire: false
                        ssh_pwauth: true

    # --- Now that the VM/pod exists (and will bind the PVC), wait for the
    #     import to actually finish. ---
    - name: Wait for DataVolume import to fully complete (post-VM-creation)
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ vm_name }}-boot-dv"
        namespace: "{{ vm_namespace }}"
      register: dv_final
      until: >
        (dv_final.resources | default([]) | length > 0) and
        (dv_final.resources[0].status.phase | default('') == "Succeeded")
      retries: 60
      delay: 15
      ignore_errors: true

    - name: Fail with diagnostics if DataVolume import never completed
      ansible.builtin.fail:
        msg: >
          DataVolume {{ vm_name }}-boot-dv did not reach Succeeded after VM creation.
          Last known status: {{ dv_final.resources[0].status | default('no status - see dv_final.msg') }}
          Raw error (if any): {{ dv_final.msg | default('none') }}
      when: >
        (dv_final.resources | default([]) | length == 0) or
        (dv_final.resources[0].status.phase | default('') != "Succeeded")

    - name: Sanity-check VMI lookup before waiting
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: vmi_debug
      ignore_errors: true

    - name: Fail fast if VMI lookup itself is erroring
      ansible.builtin.fail:
        msg: "kubernetes.core.k8s_info failed outright: {{ vmi_debug.msg | default('none') }}"
      when: vmi_debug is failed

    - name: Wait for VM to report Running
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachineInstance
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
      register: vmi
      until: >
        (vmi.resources | default([]) | length > 0) and
        (vmi.resources[0].status.phase | default('') == "Running")
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Fail with diagnostics if VM never reached Running
      ansible.builtin.fail:
        msg: >
          VirtualMachineInstance {{ vm_name }} did not reach Running.
          Last known status: {{ vmi.resources[0].status | default('no status - see vmi.msg') }}
          Raw error (if any): {{ vmi.msg | default('none') }}
      when: >
        (vmi.resources | default([]) | length == 0) or
        (vmi.resources[0].status.phase | default('') != "Running")

    # --- Reconcile to the desired run_strategy. No-op here since run_strategy
    #     is Always, but left in for when you later switch it to Manual/Halted. ---
    - name: Reconcile runStrategy to desired steady-state
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kubevirt.io/v1
          kind: VirtualMachine
          metadata:
            name: "{{ vm_name }}"
            namespace: "{{ vm_namespace }}"
          spec:
            runStrategy: "{{ run_strategy }}"
      when: run_strategy != "Always"

    - name: Success
      ansible.builtin.debug:
        msg: "VM {{ vm_name }} in namespace {{ vm_namespace }} is Running, booted from {{ quay_image }}."

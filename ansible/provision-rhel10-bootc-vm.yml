---
- name: Provision RHEL 10 bootc VM on OpenShift Virtualization
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - kubernetes.core
  vars:
    vm_namespace: bootc-vms
    vm_name: rhel10-bootc-vm
    dv_name: "{{ vm_name }}-dv"
    image_tag: "prod"          # set to dev or prod
    image_url: "docker://quay.io/waba/bootc-guide:{{ image_tag }}"
    storage_class: "lvms-vg1"
    storage_size: "30Gi"
    pull_secret_name: "{{ vm_name }}-quay-pull-secret"
    use_pull_secret: false
    registry_source: "{{ {'url': image_url} | combine({'secretRef': pull_secret_name} if use_pull_secret else {}) }}"
    memory: "8Gi"
    cpu_cores: 4
    ssh_pub_key: "REPLACE_WITH_YOUR_SSH_PUBLIC_KEY"

  tasks:
    - name: Create namespace if it does not exist
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ vm_namespace }}"
        state: present

    - name: Read local docker config for Quay auth
      ansible.builtin.set_fact:
        docker_config: "{{ lookup('file', '~/.docker/config.json') | from_json }}"
      when: use_pull_secret

    - name: Parse Quay credentials
      ansible.builtin.set_fact:
        quay_auth: "{{ (docker_config.auths['quay.io'].auth | default(docker_config.auths['https://quay.io'].auth) | b64decode).split(':', 1) }}"
      no_log: true
      when: use_pull_secret

    - name: Create CDI-compatible pull secret for Quay
      kubernetes.core.k8s:
        api_version: v1
        kind: Secret
        name: "{{ pull_secret_name }}"
        namespace: "{{ vm_namespace }}"
        state: present
        definition:
          type: Opaque
          data:
            accessKeyId: "{{ quay_auth[0] | b64encode }}"
            secretKey: "{{ quay_auth[1] | b64encode }}"
      when: use_pull_secret and (lookup('fileglob', '~/.docker/config.json') | length > 0)

    - name: Create DataVolume for RHEL 10 bootc image
      kubernetes.core.k8s:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ dv_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          spec:
            source:
              registry: "{{ registry_source }}"
            storage:
              storageClassName: "{{ storage_class }}"
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: "{{ storage_size }}"
      register: dv_result

    - name: Create VirtualMachine (start immediately so WFFC storage can bind)
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          metadata:
            labels:
              kubevirt.io/vm: "{{ vm_name }}"
          spec:
            running: true
            template:
              metadata:
                labels:
                  kubevirt.io/vm: "{{ vm_name }}"
              spec:
                domain:
                  devices:
                    disks:
                      - name: rootdisk
                        disk:
                          bus: virtio
                      - name: cloudinitdisk
                        cdrom:
                          bus: sata
                  resources:
                    requests:
                      memory: "{{ memory }}"
                      cpu: "{{ cpu_cores }}"
                volumes:
                  - name: rootdisk
                    dataVolume:
                      name: "{{ dv_name }}"
                  - name: cloudinitdisk
                    cloudInitNoCloud:
                      userData: |-
                        #cloud-config
                        user: cloud-user
                        password: redhat
                        chpasswd: { expire: False }
                        ssh_pwauth: True
                        ssh_authorized_keys:
                          - "{{ ssh_pub_key }}"

    - name: Wait for DataVolume to be ready
      kubernetes.core.k8s_info:
        api_version: cdi.kubevirt.io/v1beta1
        kind: DataVolume
        name: "{{ dv_name }}"
        namespace: "{{ vm_namespace }}"
      register: dv_status
      until:
        - dv_status.resources[0].status.phase == "Succeeded"
        - dv_status.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready') | map(attribute='status') | first == "True"
      retries: 60
      delay: 10
      failed_when: dv_status.resources[0].status.phase != "Succeeded"
      vars:
        ansible_failed_result:
          msg: "DataVolume {{ dv_name }} did not reach 'Succeeded' state."

    - name: Start the VirtualMachine
      kubernetes.core.k8s:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        name: "{{ vm_name }}"
        namespace: "{{ vm_namespace }}"
        definition:
          spec:
            running: true

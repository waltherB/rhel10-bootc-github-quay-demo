apiVersion: v1
kind: Secret
metadata:
  name: quay-pull-secret
  namespace: bootc-vms
type: kubernetes.io/dockerconfigjson
data:
  # Base64-encoded Podman auth file with Quay credentials.
  # On macOS with Podman, auth is stored in ~/.config/containers/auth.json
  # Generate with:
  #   oc create secret docker-registry quay-pull-secret \
  #     --docker-server=quay.io \
  #     --docker-username=<user> \
  #     --docker-password=<token> \
  #     --namespace=bootc-vms \
  #     --dry-run=client -o yaml
  # Or base64-encode the Podman auth file directly:
  #   base64 < ~/.config/containers/auth.json
  .dockerconfigjson: REPLACE_WITH_BASE64_DOCKER_CONFIG

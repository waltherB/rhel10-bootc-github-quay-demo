---
# ServiceAccount used by the VM pod and CDI importer within bootc-vms namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bootc-vm-sa
  namespace: bootc-vms

---
# Allow the CDI importer to pull from Quay using the quay-pull-secret.
# CDI runs the importer pod under the default SA in the target namespace,
# so the secret just needs to exist – but the SA below is used by the VM pod itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bootc-vm-role
  namespace: bootc-vms
rules:
  # VM pod needs to read its own DataVolume and PVC
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]
  # virtctl SSH needs to create/use subresource on VMI
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/console", "virtualmachineinstances/vnc", "virtualmachineinstances/ssh"]
    verbs: ["get", "update"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bootc-vm-rolebinding
  namespace: bootc-vms
subjects:
  - kind: ServiceAccount
    name: bootc-vm-sa
    namespace: bootc-vms
roleRef:
  kind: Role
  name: bootc-vm-role
  apiGroup: rbac.authorization.k8s.io

---
# Grant the CDI importer SA permission to use the quay-pull-secret.
# CDI imports DataVolumes using the 'default' SA in the target namespace.
# Linking the pull secret to that SA allows the importer pod to authenticate to Quay.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cdi-importer-pull-secret
  namespace: bootc-vms
subjects:
  - kind: ServiceAccount
    name: default
    namespace: bootc-vms
roleRef:
  kind: ClusterRole
  name: system:image-puller
  apiGroup: rbac.authorization.k8s.io

name: Build, Sign, and Push bootc (AMD64 & ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  QUAY_REPO: "quay.io/waba/bootc-guide"

jobs:
  # ============================================================
  # 1. AMD64 JOB (Runs on GitHub-Hosted x86_64 Runner)
  # ============================================================
  build-amd64:
    name: Build AMD64 (GitHub Runner)
    runs-on: ubuntu-latest
    env:
      IMAGE_AMD: "quay.io/waba/bootc-guide:dev-amd64"
      DISK_IMAGE_AMD: "quay.io/waba/bootc-guide:dev-disk-amd64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to registry.redhat.io
        run: |
          if [ -z "${{ secrets.RH_REGISTRY_USERNAME }}" ] || [ -z "${{ secrets.RH_REGISTRY_PASSWORD }}" ]; then
            echo "❌ ERROR: RH_REGISTRY_USERNAME or RH_REGISTRY_PASSWORD secrets are not set!"
            echo "Please add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "${{ secrets.RH_REGISTRY_PASSWORD }}" | \
            podman login registry.redhat.io \
              -u "${{ secrets.RH_REGISTRY_USERNAME }}" --password-stdin

      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # PHASE 1: Build the AMD64 OS container image
      - name: Build bootc AMD64 Container Image
        run: |
          podman build \
            --platform linux/amd64 \
            --build-arg RHSM_ORG="${{ secrets.RHSM_ORG }}" \
            --build-arg RHSM_ACTIVATION_KEY="${{ secrets.RHSM_ACTIVATION_KEY }}" \
            -t ${{ env.IMAGE_AMD }} \
            -f Containerfile .

      # PHASE 1 (Push): Must push to Quay before bootc-image-builder runs!
      - name: Push AMD64 Container Image to Quay
        run: |
          podman push ${{ env.IMAGE_AMD }}

      # PHASE 2: Pull container image from Quay & assemble qcow2 disk
      - name: Build bootc AMD64 qcow2 Disk
        run: |
          mkdir -p output-amd64
          podman run --rm --privileged \
            -v ./output-amd64:/output \
            registry.redhat.io/rhel10/bootc-image-builder:latest \
            --type qcow2 \
            --target-arch amd64 \
            ${{ env.IMAGE_AMD }}

      - name: Upload AMD64 qcow2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcow2-amd64
          path: output-amd64/qcow2/disk.qcow2

  # ============================================================
  # 2. ARM64 JOB (Runs on Local / Self-Hosted ARM64 Runner)
  # ============================================================
  build-arm64:
    name: Build ARM64 (Self-Hosted Runner)
    # Adjust runner label below to match your GitHub self-hosted runner configuration
    runs-on: [self-hosted, ARM64]
    env:
      IMAGE_ARM: "quay.io/waba/bootc-guide:dev-arm64"
      DISK_IMAGE_ARM: "quay.io/waba/bootc-guide:dev-disk-arm64"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to registry.redhat.io
        run: |
          if [ -z "${{ secrets.RH_REGISTRY_USERNAME }}" ] || [ -z "${{ secrets.RH_REGISTRY_PASSWORD }}" ]; then
            echo "❌ ERROR: RH_REGISTRY_USERNAME or RH_REGISTRY_PASSWORD secrets are not set!"
            echo "Please add them at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "${{ secrets.RH_REGISTRY_PASSWORD }}" | \
            podman login registry.redhat.io \
              -u "${{ secrets.RH_REGISTRY_USERNAME }}" --password-stdin


      - name: Log in to Quay.io
        uses: redhat-actions/podman-login@v1
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # PHASE 1: Build the ARM64 OS container image
      - name: Build bootc ARM64 Container Image
        run: |
          podman build \
            --platform linux/arm64 \
            --build-arg RHSM_ORG="${{ secrets.RHSM_ORG }}" \
            --build-arg RHSM_ACTIVATION_KEY="${{ secrets.RHSM_ACTIVATION_KEY }}" \
            -t ${{ env.IMAGE_ARM }} \
            -f Containerfile .

      # PHASE 1 (Push): Push dev-arm64 tag to Quay
      - name: Push ARM64 Container Image to Quay
        run: |
          podman push ${{ env.IMAGE_ARM }}

      # PHASE 2: Pull dev-arm64 container image from Quay & assemble qcow2 disk
      - name: Build bootc ARM64 qcow2 Disk
        run: |
          mkdir -p output-arm64
          podman run --rm --privileged \
            -v ./output-arm64:/output \
            registry.redhat.io/rhel10/bootc-image-builder:latest \
            --type qcow2 \
            --target-arch arm64 \
            ${{ env.IMAGE_ARM }}

      - name: Upload ARM64 qcow2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qcow2-arm64
          path: output-arm64/qcow2/disk.qcow2
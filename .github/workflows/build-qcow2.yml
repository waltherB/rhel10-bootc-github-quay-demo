name: Build bootc amd64 qcow2

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Source bootc container image to convert"
        required: false
        default: "quay.io/waba/bootc-guide:dev"
      output_ref:
        description: "OCI artifact ref to push the qcow2 to"
        required: false
        default: "quay.io/waba/bootc-guide-disk:amd64-latest"

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ github.event.inputs.image }}
      OUTPUT_REF: ${{ github.event.inputs.output_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      # Wipe any storage state the runner image may have pre-seeded
      - name: Reset container storage
        run: |
          sudo podman system reset --force || true
          sudo rm -rf /var/lib/containers/storage /run/containers/storage

      - name: Show podman storage info
        run: sudo podman info

      - name: Log in to registry.redhat.io
        run: |
          echo "${{ secrets.RH_REGISTRY_PASSWORD }}" | \
            sudo podman login registry.redhat.io \
              -u "${{ secrets.RH_REGISTRY_USERNAME }}" --password-stdin

      - name: Log in to quay.io
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | \
            sudo podman login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Pull source image
        run: sudo podman pull "$IMAGE"

      - name: Pull bootc-image-builder
        run: sudo podman pull registry.redhat.io/rhel10/bootc-image-builder:latest

      - name: Verify images are present
        run: sudo podman images

      - name: Build qcow2
        run: |
          mkdir -p output
          # Get the storage path
          STORAGE_PATH=$(sudo podman image inspect "$IMAGE" --format '{{.GraphDriver.Data.MergedDir}}' | sed 's/\/merged$//')
          echo "Storage path: $STORAGE_PATH"
          sudo podman run --rm --privileged \
          --pull=newer \
          --security-opt label=type:unconfined_t \
          -v /var/lib/containers/storage:/var/lib/containers/storage \
          -v "${{ github.workspace }}/config/config.toml":/config.toml:ro \
          -v "${{ github.workspace }}/output":/output \
           registry.redhat.io/rhel10/bootc-image-builder:latest \
          --type qcow2 \
          --config /config.toml \
          "$IMAGE"

      - name: Fix ownership of build output
        run: sudo chown -R "$(id -u):$(id -g)" output

      - name: Rename output
        run: mv output/qcow2/disk.qcow2 output/qcow2/disk-amd.qcow2

      - name: Install oras
        run: |
          curl -sSL -o oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo mv oras /usr/local/bin/oras

      - name: Log in to quay.io for oras
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | \
            oras login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Push qcow2 as OCI artifact
        run: |
          oras push "$OUTPUT_REF" \
            --artifact-type application/vnd.qcow2 \
            output/qcow2/disk-amd.qcow2:application/x-qemu-disk

      # Fallback copy so you always have the build output even if the
      # push step needs adjusting later.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-amd-qcow2
          path: output/qcow2/disk-amd.qcow2
          retention-days: 7

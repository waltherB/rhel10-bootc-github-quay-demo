name: Build bootc amd64 qcow2

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Source bootc container image to convert"
        required: false
        default: "quay.io/waba/bootc-guide:dev"
      output_ref:
        description: "OCI artifact ref to push the qcow2 to"
        required: false
        default: "quay.io/waba/bootc-guide-disk:amd64-latest"

jobs:
  build:
    # ubuntu-latest is a native amd64 VM with KVM already enabled -
    # no Rosetta/QEMU translation, so the earlier libpod_lock/emulation
    # issue seen on Apple Silicon podman machine builds doesn't apply here.
    runs-on: ubuntu-latest

    env:
      IMAGE: ${{ github.event.inputs.image }}
      OUTPUT_REF: ${{ github.event.inputs.output_ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Log in to registry.redhat.io
        run: |
          echo "${{ secrets.RH_REGISTRY_PASSWORD }}" | \
            sudo podman login registry.redhat.io \
              -u "${{ secrets.RH_REGISTRY_USERNAME }}" --password-stdin

      - name: Get current user/group
        id: whoami
        run: echo "id=$(id -u):$(id -g)" >> "$GITHUB_OUTPUT"

      # Using the upstream action instead of hand-rolled `podman run` -
      # it wraps the correct invocation (storage mount, --local handling,
      # chown, manifest generation) and is what osbuild's own CI runs on
      # GitHub-hosted runners, avoiding the "no such container" /
      # storage-driver quirks the raw apt podman + manual mount hit.
      - name: Build qcow2
        id: build-qcow2
        uses: osbuild/bootc-image-builder-action@v0.0.2
        with:
          image: ${{ env.IMAGE }}
          builder-image: registry.redhat.io/rhel10/bootc-image-builder:latest
          config-file: ./config/config.toml
          types: |
            qcow2
          chown: ${{ steps.whoami.outputs.id }}

      - name: Rename output
        id: rename
        run: |
          SRC="${{ steps.build-qcow2.outputs.qcow2-output-path }}"
          DEST="$(dirname "$SRC")/disk-amd.qcow2"
          mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Install oras
        run: |
          curl -sSL -o oras.tar.gz \
            https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          tar -xzf oras.tar.gz oras
          sudo mv oras /usr/local/bin/oras

      - name: Log in to quay.io
        run: |
          echo "${{ secrets.QUAY_TOKEN }}" | \
            oras login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Push qcow2 as OCI artifact
        run: |
          oras push "$OUTPUT_REF" \
            --artifact-type application/vnd.qcow2 \
            "${{ steps.rename.outputs.path }}:application/x-qemu-disk"

      # Fallback copy so you always have the build output even if the
      # push step needs adjusting later.
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: disk-amd-qcow2
          path: ${{ steps.rename.outputs.path }}
          retention-days: 7
